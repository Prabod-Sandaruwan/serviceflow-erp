name: CI Quality Gate

on:
  push:
    branches: ['main', 'feature/**', 'fix/**']
  pull_request:
    branches: ['main']

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: serviceflow_test
          MYSQL_USER: serviceflow_test
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: mysql://serviceflow_test:testpassword@127.0.0.1:3306/serviceflow_test
        run: npx --prefix server prisma migrate deploy

      - name: Run test suites
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://serviceflow_test:testpassword@127.0.0.1:3306/serviceflow_test
          SESSION_SECRET: ci-test-session-secret-must-be-at-least-32-chars-long
        run: npm test

      - name: Run production build
        run: npm run build
